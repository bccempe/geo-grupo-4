version: "3.9"

services:
  # =========================
  # DATABASE
  # =========================
  db:
    image: postgis/postgis:15-3.4
    container_name: postgis_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - web

  # =========================
  # BACKEND
  # =========================
  backend:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      georoute-foot:
        condition: service_healthy
      georoute-car:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    profiles:
      - web

  # =========================
  # ROUTING: GEOROUTE (RUST)
  # =========================
  georoute-foot:
    build:
      context: ./backend
      dockerfile: Dockerfile.georoute
    container_name: georoute_foot
    restart: always
    depends_on:
      georoute-graph-builder:
        condition: service_completed_successfully
    volumes:
      - ./backend/data/georoute:/graphs:ro
    command: ["georoute-server", "/graphs/rm-foot.grt", "--ch", "/graphs/rm-foot.chg", "--bind", "0.0.0.0:8090"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8090/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - web

  georoute-car:
    build:
      context: ./backend
      dockerfile: Dockerfile.georoute
    container_name: georoute_car
    restart: always
    depends_on:
      georoute-graph-builder:
        condition: service_completed_successfully
    volumes:
      - ./backend/data/georoute:/graphs:ro
    command: ["georoute-server", "/graphs/rm-car.grt", "--ch", "/graphs/rm-car.chg", "--bind", "0.0.0.0:8090"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8090/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - web

  georoute-graph-builder:
    build:
      context: ./backend
      dockerfile: Dockerfile.georoute
    container_name: georoute_graph_builder
    volumes:
      - ./backend/data:/data
      - ./backend/scripts/build_georoute_graphs.sh:/usr/local/bin/build_georoute_graphs.sh:ro
    environment:
      GEOROUTE_PBF_URL: https://download.geofabrik.de/south-america/chile-latest.osm.pbf
      GEOROUTE_RM_BBOX: -71.60,-34.90,-69.60,-32.80
    entrypoint: ["/bin/sh", "/usr/local/bin/build_georoute_graphs.sh"]
    profiles:
      - web

  # =========================
  # FRONTEND (React + Nginx)
  # =========================
  frontend:
    build: ./frontend
    container_name: react_app
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "8501:8501"
    profiles:
      - web

  # =========================
  # BATCH: DESCARGA DATOS BASE
  # =========================
  drive-sync:
    build:
      context: ./backend/scripts/Cargar_datos
    container_name: drive_sync
    env_file:
      - .env
    volumes:
      - ./backend/data:/data
    command: ["python", "descargar_datos.py"]
    profiles:
      - batch

  # =========================
  # BATCH: ETL (DEPENDE DE DATOS)
  # =========================
  etl-loader:
    build:
      context: ./backend/scripts/Cargar_datos
    container_name: etl_loader
    depends_on:
      db:
        condition: service_healthy
      drive-sync:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./backend/data:/data
      - ./backend/scripts:/app/scripts:ro
      - ./backend/utils:/app/utils:ro
    command: ["python", "auto_import.py"]
    profiles:
      - batch

  # =========================
  # BATCH: DESCARGA OSM
  # =========================
  osm-downloader:
    build:
      context: ./backend/Isocronas_caminando
    container_name: osm_downloader
    volumes:
      - ./backend/data:/data
    command: ["python", "descargar_grafo_isocrona.py"]
    profiles:
      - batch

  # =========================
  # BATCH: CREAR GRAFO OSM
  # =========================
  osm-routing-loader:
    build:
      context: ./backend/Isocronas_caminando
    container_name: osm_routing_loader
    depends_on:
      db:
        condition: service_healthy
      osm-downloader:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./backend/data:/data
    command: ["python", "guardar_grafo.py"]
    profiles:
      - batch

  # =========================
  # BATCH: PROCESAR GTFS
  # =========================
  process-gtfs:
    build:
      context: ./backend
    container_name: process_gtfs
    depends_on:
      db:
        condition: service_healthy
      etl-loader:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    command: ["python", "-m", "scripts.gtfs"]
    profiles:
      - batch

volumes:
  postgres_data:
