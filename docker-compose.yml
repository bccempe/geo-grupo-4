version: "3.9"

services:
  # =========================
  # DATABASE
  # =========================
  db:
    image: postgis/postgis:15-3.4
    container_name: postgis_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - web

  # =========================
  # BACKEND
  # =========================
  backend:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    profiles:
      - web

  # =========================
  # FRONTEND
  # =========================
  frontend:
    build: ./frontend
    container_name: streamlit_app
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    profiles:
      - web

  # =========================
  # BATCH: DESCARGA DATOS BASE
  # =========================
  drive-sync:
    build:
      context: ./backend/scripts/Cargar_datos
    container_name: drive_sync
    env_file:
      - .env
    volumes:
      - ./backend/data:/data
    command: ["python", "descargar_datos.py"]
    profiles:
      - batch

  # =========================
  # BATCH: ETL (DEPENDE DE DATOS)
  # =========================
  etl-loader:
    build:
      context: ./backend/scripts/Cargar_datos
    container_name: etl_loader
    depends_on:
      db:
        condition: service_healthy
      drive-sync:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./backend/data:/data
      - ./backend/scripts:/app/scripts:ro
      - ./backend/utils:/app/utils:ro
    command: ["python", "auto_import.py"]
    profiles:
      - batch

  # =========================
  # BATCH: DESCARGA OSM
  # =========================
  osm-downloader:
    build:
      context: ./backend/Isocronas_caminando
    container_name: osm_downloader
    volumes:
      - ./backend/data:/data
    command: ["python", "descargar_grafo_isocrona.py"]
    profiles:
      - batch

  # =========================
  # BATCH: CREAR GRAFO OSM
  # =========================
  osm-routing-loader:
    build:
      context: ./backend/Isocronas_caminando
    container_name: osm_routing_loader
    depends_on:
      db:
        condition: service_healthy
      osm-downloader:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./backend/data:/data
    command: ["python", "guardar_grafo.py"]
    profiles:
      - batch

  # =========================
  # BATCH: PROCESAR GTFS
  # =========================
  process-gtfs:
    build:
      context: ./backend
    container_name: process_gtfs
    depends_on:
      db:
        condition: service_healthy
      etl-loader:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
    command: ["python", "-m", "scripts.gtfs"]
    profiles:
      - batch

volumes:
  postgres_data:
